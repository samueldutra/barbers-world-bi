name: ETL Bling — Vendas, Clientes e Produtos (a cada hora)

# Roda a cada hora, cheia (UTC). Também pode ser disparado manualmente pela aba
# "Actions" do GitHub (botão "Run workflow") pra testar sem esperar o cron.
on:
  schedule:
    - cron: '0 * * * *'
  # Execução manual aceita parâmetros pra forçar atualização (ex.: status alterados no
  # Bling em pedidos antigos). Vazios = mesmo comportamento do agendamento.
  workflow_dispatch:
    inputs:
      alterados_horas:
        description: 'Recarregar pedidos ALTERADOS no Bling nas últimas N horas, qualquer data do pedido (padrão 24; ex.: 720 = 30 dias)'
        required: false
        default: '24'
      data_inicial:
        description: 'Recarregar pedidos EMITIDOS desde esta data (AAAA-MM-DD). Vazio = últimos 5 dias'
        required: false
        default: ''

jobs:
  etl:
    runs-on: ubuntu-latest
    # Os segredos são do REPOSITÓRIO (Settings > Secrets and variables > Actions), sem depender de
    # nenhum "environment" — antes ficavam num ambiente criado pela integração da Vercel, que some
    # junto com o projeto duplicado da Vercel. Para cadastrar/atualizar: scripts/mover-segredos-etl-github.sh.
    # A sincronização de clientes processa "rodadas" de contatos pendentes até não sobrar
    # nenhum — na primeira execução (ou depois de um backfill grande de vendas) pode
    # demorar bem mais que uma rodada incremental normal. Se estourar, é seguro rodar de
    # novo (workflow_dispatch) — ela retoma de onde parou, só busca quem ainda está
    # pendente.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: etl-bling-pedidos-vendas
    env:
      # Mesmo caminho de execução local (sem SSM/AWS) — só troca de onde roda.
      LOCAL_MODE: 'true'
      ETL_CLIENTE: barbers
      LOCAL_CLIENT_CONFIGS: '{"barbers":{"schema":"barbers"}}'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
      BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
      BLING_REDIRECT_URI: ${{ secrets.BLING_REDIRECT_URI }}
      BLING_CONTA: barbers
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Falha logo, com mensagem clara, se faltar segredo ou se a chave do Supabase não for a
      # service_role (as funções de carga do banco só aceitam essa chave).
      - name: Confere os segredos
        run: |
          faltando=""
          for nome in SUPABASE_URL SUPABASE_SERVICE_KEY BLING_CLIENT_ID BLING_CLIENT_SECRET BLING_REDIRECT_URI; do
            [ -n "${!nome}" ] || faltando="$faltando $nome"
          done
          if [ -n "$faltando" ]; then
            echo "::error::Segredos do repositório faltando:$faltando. Rode scripts/mover-segredos-etl-github.sh (ver CLAUDE.md do ETL)."
            exit 1
          fi
          papel=$(printf '%s' "$SUPABASE_SERVICE_KEY" | python3 -c 'import sys,base64,json; t=sys.stdin.read().split("."); p=t[1]+"="*(-len(t[1])%4); print(json.loads(base64.urlsafe_b64decode(p)).get("role",""))' 2>/dev/null || true)
          if [ "$papel" != "service_role" ]; then
            echo "::error::SUPABASE_SERVICE_KEY não é a chave service_role (papel: ${papel:-ilegível}). Pegue a service_role em Supabase > Settings > API."
            exit 1
          fi

      - name: Instala dependências
        run: pip install -r requirements.txt

      # Pedidos emitidos nos últimos 5 dias + pedidos ALTERADOS nas últimas 24h (qualquer
      # data de emissão). Sem o segundo, mudança de situação em pedido antigo (ex.: Em
      # aberto → Atendido depois de uma semana) nunca chega ao BI. Upsert cuida de duplicata.
      - name: Vendas (emitidos nos últimos 5 dias + alterados recentemente)
        env:
          INPUT_DATA_INICIAL: ${{ inputs.data_inicial }}
          ETL_ALTERADOS_HORAS: ${{ inputs.alterados_horas || '24' }}
        run: |
          export ETL_DATA_INICIAL="${INPUT_DATA_INICIAL:-$(date -u -d '5 days ago' +%F)}"
          python etl-bling-pedidos-vendas.py

      - name: Clientes (contatos pendentes de sincronizar)
        run: python sync-clientes-bling.py

      - name: Produtos (listagem de ativos — preço atual; detalhe roda local)
        env:
          SYNC_PRODUTOS_SO_LISTAGEM: 'true'
        run: python sync-produtos-bling.py

      # Canais de venda (1 request ao Bling) — integração criada/recriada no Bling (novo
      # loja.id) ganha nome no BI sozinha. Integração recriada que precisa juntar com a
      # antiga: ver etl-bling-pedidos-vendas/sql/create_table_canais_venda_de_para.sql.
      - name: Canais de venda (catálogo do Bling)
        run: python sync-canais-venda-bling.py

      # Nomes das situações de pedido (inclui as personalizadas, ex.: "CARRO RODRIGO") —
      # 1 request ao Bling. Por último pra uma falha aqui não atrasar os passos acima.
      - name: Situações de pedido (nomes do catálogo do Bling)
        run: python sync-situacoes-bling.py

      # Pedidos da Nuvemshop (lojas conectadas no módulo Canais de Venda do dashboard). Sem loja
      # conectada, só avisa e termina. Roda mesmo se um passo do Bling falhou (fontes independentes).
      # Execução manual: o campo "alterados_horas" também vale aqui (ex.: 720 = últimos 30 dias).
      - name: Nuvemshop (pedidos alterados recentemente)
        if: ${{ !cancelled() }}
        working-directory: etl-nuvemshop-pedidos
        env:
          ETL_ALTERADOS_HORAS: ${{ inputs.alterados_horas || '24' }}
        run: |
          pip install -r requirements.txt
          python etl-nuvemshop-pedidos.py
