name: ETL Bling — Vendas, Clientes e Produtos (a cada hora)

# Roda a cada hora, cheia (UTC). Também pode ser disparado manualmente pela aba
# "Actions" do GitHub (botão "Run workflow") pra testar sem esperar o cron.
on:
  schedule:
    - cron: '0 * * * *'
  # Execução manual aceita parâmetros pra forçar atualização (ex.: status alterados no
  # Bling em pedidos antigos). Vazios = mesmo comportamento do agendamento.
  workflow_dispatch:
    inputs:
      alterados_horas:
        description: 'Recarregar pedidos ALTERADOS no Bling nas últimas N horas, qualquer data do pedido (padrão 24; ex.: 720 = 30 dias)'
        required: false
        default: '24'
      data_inicial:
        description: 'Recarregar pedidos EMITIDOS desde esta data (AAAA-MM-DD). Vazio = últimos 5 dias'
        required: false
        default: ''
      explorar_vinculos_lojas:
        description: 'SOMENTE LEITURA: ids de produto do Bling (separados por vírgula) para inspecionar o vínculo produto x loja ("ID na loja"). Vazio = não roda. Use com apenas_nuvemshop marcado'
        required: false
        default: ''
      vincular_lote:
        description: 'ESCRITA NO BLING (lote): quantos produtos processar neste disparo (ex.: 20). Cria/corrige o vínculo produto x loja (ID na loja) dos candidatos de obter_vinculos_a_gravar, sem alterar preços. Vazio = não roda. Use com apenas_nuvemshop marcado'
        required: false
        default: ''
      atualizar_estoque_lote:
        description: 'ESCRITA NA NUVEMSHOP (lote): quantas variantes processar neste disparo (ex.: 20). Grava o saldo do Bling no estoque (zera/reabre/negativo=0), sem tocar em preço. Vazio = não roda. Use com apenas_nuvemshop marcado'
        required: false
        default: ''
      diagnosticar_produto_nuvemshop:
        description: 'SOMENTE LEITURA: ids de produto da Nuvemshop (separados por vírgula) — mostra a marca, as categorias e o pai de cada categoria direto da API. Use com apenas_nuvemshop marcado'
        required: false
        default: ''
      aplicar_sku_lote:
        description: 'ESCRITA NA NUVEMSHOP (SKU): quantas variantes gravar neste disparo (1 = teste). Grava o código exato do Bling no SKU das variantes do campo aplicar_sku_plano, sem tocar em preço, estoque ou publicação. Vazio = não roda. Use com apenas_nuvemshop marcado'
        required: false
        default: ''
      aplicar_sku_plano:
        description: 'Plano do aplicar_sku_lote: PRODUTO_NS:VARIANTE_NS:CODIGO_BLING separados por | (lista decidida e conferida pelo usuário)'
        required: false
        default: ''
      atualizar_estoque_nuvemshop:
        description: 'ESCRITA NA NUVEMSHOP (teste, 1 variante): ID_PRODUTO_BLING:ID_VARIANTE_NS:ESTOQUE_ATUAL_NS:SALDO_BLING — grava o saldo do Bling no estoque da variante, sem tocar em preço. Vazio = não roda. Use com apenas_nuvemshop marcado'
        required: false
        default: ''
      comparar_estoque:
        description: 'SOMENTE LEITURA: compara o saldo do Bling com o estoque da Nuvemshop (SKU idêntico) e grava os saldos em barbers.estoque_saldos_bling. Use com apenas_nuvemshop marcado'
        required: false
        type: boolean
        default: false
      vincular_produto_loja:
        description: 'ESCRITA NO BLING (teste, 1 produto): ID_PRODUTO:ID_LOJA:ID_NA_LOJA:PRECO_CADASTRO:PRECO_VINCULO:ESTOQUE_ESPERADO — cria o vínculo produto x loja SEM alterar preços. Vazio = não roda. Use com apenas_nuvemshop marcado'
        required: false
        default: ''
      sync_vinculos_lojas:
        description: 'Sincronizar os vínculos produto x loja do Bling (ID na loja) para barbers.produtos_lojas — só lê o Bling (~2 min). Use com apenas_nuvemshop marcado'
        required: false
        type: boolean
        default: false
      apenas_nuvemshop:
        description: 'Pular os passos do Bling e rodar só os da Nuvemshop (ex.: backfill de pedidos com alterados_horas=8760)'
        required: false
        type: boolean
        default: false

jobs:
  etl:
    runs-on: ubuntu-latest
    # Os segredos são do REPOSITÓRIO (Settings > Secrets and variables > Actions), sem depender de
    # nenhum "environment" — antes ficavam num ambiente criado pela integração da Vercel, que some
    # junto com o projeto duplicado da Vercel. Para cadastrar/atualizar: scripts/mover-segredos-etl-github.sh.
    # A sincronização de clientes processa "rodadas" de contatos pendentes até não sobrar
    # nenhum — na primeira execução (ou depois de um backfill grande de vendas) pode
    # demorar bem mais que uma rodada incremental normal. Se estourar, é seguro rodar de
    # novo (workflow_dispatch) — ela retoma de onde parou, só busca quem ainda está
    # pendente.
    timeout-minutes: 35
    defaults:
      run:
        working-directory: etl-bling-pedidos-vendas
    env:
      # Mesmo caminho de execução local (sem SSM/AWS) — só troca de onde roda.
      LOCAL_MODE: 'true'
      ETL_CLIENTE: barbers
      LOCAL_CLIENT_CONFIGS: '{"barbers":{"schema":"barbers"}}'
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      BLING_CLIENT_ID: ${{ secrets.BLING_CLIENT_ID }}
      BLING_CLIENT_SECRET: ${{ secrets.BLING_CLIENT_SECRET }}
      BLING_REDIRECT_URI: ${{ secrets.BLING_REDIRECT_URI }}
      BLING_CONTA: barbers
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Falha logo, com mensagem clara, se faltar segredo ou se a chave do Supabase não for a
      # service_role (as funções de carga do banco só aceitam essa chave).
      - name: Confere os segredos
        run: |
          faltando=""
          for nome in SUPABASE_URL SUPABASE_SERVICE_KEY BLING_CLIENT_ID BLING_CLIENT_SECRET BLING_REDIRECT_URI; do
            [ -n "${!nome}" ] || faltando="$faltando $nome"
          done
          if [ -n "$faltando" ]; then
            echo "::error::Segredos do repositório faltando:$faltando. Rode scripts/mover-segredos-etl-github.sh (ver CLAUDE.md do ETL)."
            exit 1
          fi
          papel=$(printf '%s' "$SUPABASE_SERVICE_KEY" | python3 -c 'import sys,base64,json; t=sys.stdin.read().split("."); p=t[1]+"="*(-len(t[1])%4); print(json.loads(base64.urlsafe_b64decode(p)).get("role",""))' 2>/dev/null || true)
          if [ "$papel" != "service_role" ]; then
            echo "::error::SUPABASE_SERVICE_KEY não é a chave service_role (papel: ${papel:-ilegível}). Pegue a service_role em Supabase > Settings > API."
            exit 1
          fi

      - name: Instala dependências
        run: pip install -r requirements.txt

      # Pedidos emitidos nos últimos 5 dias + pedidos ALTERADOS nas últimas 24h (qualquer
      # data de emissão). Sem o segundo, mudança de situação em pedido antigo (ex.: Em
      # aberto → Atendido depois de uma semana) nunca chega ao BI. Upsert cuida de duplicata.
      - name: Vendas (emitidos nos últimos 5 dias + alterados recentemente)
        if: ${{ !inputs.apenas_nuvemshop }}
        env:
          INPUT_DATA_INICIAL: ${{ inputs.data_inicial }}
          ETL_ALTERADOS_HORAS: ${{ inputs.alterados_horas || '24' }}
        run: |
          export ETL_DATA_INICIAL="${INPUT_DATA_INICIAL:-$(date -u -d '5 days ago' +%F)}"
          python etl-bling-pedidos-vendas.py

      - name: Clientes (contatos pendentes de sincronizar)
        if: ${{ !inputs.apenas_nuvemshop }}
        run: python sync-clientes-bling.py

      - name: Produtos (listagem de ativos — preço atual; detalhe roda local)
        if: ${{ !inputs.apenas_nuvemshop }}
        env:
          SYNC_PRODUTOS_SO_LISTAGEM: 'true'
        run: python sync-produtos-bling.py

      # Canais de venda (1 request ao Bling) — integração criada/recriada no Bling (novo
      # loja.id) ganha nome no BI sozinha. Integração recriada que precisa juntar com a
      # antiga: ver etl-bling-pedidos-vendas/sql/create_table_canais_venda_de_para.sql.
      - name: Canais de venda (catálogo do Bling)
        if: ${{ !inputs.apenas_nuvemshop }}
        run: python sync-canais-venda-bling.py

      # Nomes das situações de pedido (inclui as personalizadas, ex.: "CARRO RODRIGO") —
      # 1 request ao Bling. Por último pra uma falha aqui não atrasar os passos acima.
      - name: Situações de pedido (nomes do catálogo do Bling)
        if: ${{ !inputs.apenas_nuvemshop }}
        run: python sync-situacoes-bling.py

      # Vínculos produto x loja do Bling ("ID na loja") -> barbers.produtos_lojas. SOMENTE LEITURA no Bling (~50 requisições, ~30 s).
      # Alimenta o "Confirmado pelo vínculo do Bling" da tela Vínculo de SKU. Fica antes dos passos da Nuvemshop pra eles rodarem mesmo se falhar.
      - name: Vínculos produto x loja do Bling (ID na loja)
        if: ${{ !inputs.apenas_nuvemshop }}
        run: python sync-vinculos-lojas-bling.py

      # Pedidos da Nuvemshop (lojas conectadas no módulo Canais de Venda do dashboard). Sem loja
      # conectada, só avisa e termina. Roda mesmo se um passo do Bling falhou (fontes independentes).
      # Execução manual: o campo "alterados_horas" também vale aqui (ex.: 720 = últimos 30 dias).
      - name: Nuvemshop (pedidos alterados recentemente)
        if: ${{ !cancelled() && inputs.explorar_vinculos_lojas == '' && !inputs.sync_vinculos_lojas && inputs.vincular_produto_loja == '' && !inputs.comparar_estoque && inputs.atualizar_estoque_nuvemshop == '' && inputs.vincular_lote == '' && inputs.atualizar_estoque_lote == '' && inputs.aplicar_sku_lote == '' && inputs.diagnosticar_produto_nuvemshop == '' }}
        working-directory: etl-nuvemshop-pedidos
        env:
          ETL_ALTERADOS_HORAS: ${{ inputs.alterados_horas || '24' }}
        run: |
          pip install -r requirements.txt
          python etl-nuvemshop-pedidos.py

      # Catálogo da Nuvemshop (uma linha por variante, com o SKU) — alimenta o módulo "Vínculo de SKU" do
      # dashboard. Precisa do escopo read_products no token da loja. Leitura completa (~10 requisições).
      - name: Nuvemshop (catálogo de produtos)
        if: ${{ !cancelled() && inputs.explorar_vinculos_lojas == '' && !inputs.sync_vinculos_lojas && inputs.vincular_produto_loja == '' && !inputs.comparar_estoque && inputs.atualizar_estoque_nuvemshop == '' && inputs.vincular_lote == '' && inputs.atualizar_estoque_lote == '' && inputs.aplicar_sku_lote == '' && inputs.diagnosticar_produto_nuvemshop == '' }}
        working-directory: etl-nuvemshop-produtos
        run: |
          pip install -r requirements.txt
          python etl-nuvemshop-produtos.py

      # Exploração SOMENTE LEITURA do vínculo produto x loja do Bling ("ID na loja"). Só no disparo manual.
      - name: Bling (explorar vínculos produto x loja — somente leitura)
        if: ${{ inputs.explorar_vinculos_lojas != '' }}
        env:
          EXPLORAR_IDS: ${{ inputs.explorar_vinculos_lojas }}
        run: python explorar-vinculos-lojas-bling.py

      # Vínculos produto x loja do Bling -> barbers.produtos_lojas (somente leitura no Bling). Só no disparo manual.
      - name: Bling (vínculos produto x loja — sincronização)
        if: ${{ inputs.sync_vinculos_lojas }}
        run: python sync-vinculos-lojas-bling.py

      # ESCRITA no Bling: cria o vínculo produto x loja de UM produto (teste), com travas e releitura. Só no disparo manual.
      - name: Bling (vincular produto x loja — escrita, 1 produto)
        if: ${{ inputs.vincular_produto_loja != '' }}
        env:
          VINCULAR: ${{ inputs.vincular_produto_loja }}
        run: python vincular-produto-loja-bling.py

      # Compara o saldo do Bling (fonte da verdade) com o estoque da Nuvemshop — SOMENTE LEITURA. Só no disparo manual.
      - name: Estoque (comparar saldo do Bling x estoque da Nuvemshop — somente leitura)
        if: ${{ inputs.comparar_estoque }}
        run: python sync-estoque-bling-nuvemshop.py

      # ESCRITA de estoque na Nuvemshop (saldo do Bling = fonte da verdade): UMA variante por execução (teste). Só no disparo manual.
      - name: Estoque (gravar saldo do Bling na Nuvemshop — escrita, 1 variante)
        if: ${{ inputs.atualizar_estoque_nuvemshop != '' }}
        env:
          ESTOQUE_APLICAR: ${{ inputs.atualizar_estoque_nuvemshop }}
        run: python sync-estoque-bling-nuvemshop.py

      # ESCRITA no Bling (lote): cria/corrige o vínculo produto x loja dos candidatos, com travas por produto, releitura e auditoria. Só no disparo manual.
      - name: Bling (vincular produto x loja — lote)
        if: ${{ inputs.vincular_lote != '' }}
        env:
          LOTE_LIMITE: ${{ inputs.vincular_lote }}
        run: python vincular-lote-loja-bling.py

      # Diagnóstico SOMENTE LEITURA de produtos da Nuvemshop (marca/categorias ao vivo). Só no disparo manual.
      - name: Nuvemshop (diagnóstico de produto — somente leitura)
        if: ${{ inputs.diagnosticar_produto_nuvemshop != '' }}
        env:
          DIAG_PRODUTOS: ${{ inputs.diagnosticar_produto_nuvemshop }}
        run: python diagnosticar-produto-nuvemshop.py

      # ESCRITA de SKU na Nuvemshop (SKU do Bling = fonte da verdade): só o campo sku, com travas ao vivo, releitura e auditoria. Só no disparo manual.
      - name: SKU (gravar código do Bling na Nuvemshop — lote)
        if: ${{ inputs.aplicar_sku_lote != '' }}
        env:
          SKU_LIMITE: ${{ inputs.aplicar_sku_lote }}
          SKU_PLANO: ${{ inputs.aplicar_sku_plano }}
        run: python aplicar-sku-nuvemshop.py

      # ESCRITA de estoque na Nuvemshop (lote, saldo do Bling = fonte da verdade): travas ao vivo, releitura e auditoria. Só no disparo manual.
      - name: Estoque (gravar saldo do Bling na Nuvemshop — lote)
        if: ${{ inputs.atualizar_estoque_lote != '' }}
        env:
          ESTOQUE_LOTE: ${{ inputs.atualizar_estoque_lote }}
        run: python sync-estoque-bling-nuvemshop.py
